name: Build Desktop Apps

# Builds signed installers for macOS (.dmg) and Windows (.exe) and attaches
# them to the GitHub Release whenever a version tag is pushed (e.g. v1.2.3).
# Also runnable manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to upload release assets

jobs:

  # ─── macOS ──────────────────────────────────────────────────────────────────
  mac:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install ALL deps including Electron (devDependencies).
      - name: Install dependencies
        run: npm ci

      # Code signing — set these secrets in your repository Settings →
      # Secrets → Actions. Without them the build still works but macOS
      # Gatekeeper will warn users on first launch.
      #
      # Required secrets:
      #   APPLE_ID            your Apple ID email
      #   APPLE_APP_PASSWORD  app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID       10-character team ID from developer.apple.com
      #   CSC_LINK            base64-encoded .p12 certificate (see docs)
      #   CSC_KEY_PASSWORD    password for the .p12
      - name: Build macOS installer
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK:           ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD:   ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: quoteforge-mac
          path: dist/*.dmg
          if-no-files-found: error

      # Attach .dmg to the GitHub Release (only on tag push).
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  # ─── Windows ────────────────────────────────────────────────────────────────
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Windows code signing — without these the SmartScreen filter warns on
      # first run. For open-source projects, users can click "More info → Run
      # anyway"; for a paid product get an EV certificate from DigiCert/Sectigo.
      #
      # Required secrets (optional — build works unsigned without them):
      #   WIN_CSC_LINK          base64-encoded .p12 / .pfx certificate
      #   WIN_CSC_KEY_PASSWORD  certificate password
      - name: Build Windows installer
        env:
          WIN_CSC_LINK:         ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: quoteforge-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
