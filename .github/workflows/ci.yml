name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # The app must work with the optional "mqtt" package missing
  # (only live Bambu Lab printer status needs it).
  no-optional-deps:
    name: Test without optional dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --omit=optional
      - run: npm test

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quoteforge .
      - name: Start the container and check it responds
        run: |
          docker run -d --name qf -p 8080:8080 quoteforge
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs qf
          test "$ok" = 1
